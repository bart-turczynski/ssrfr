url: https://bart-turczynski.gitlab.io/ssrfr/
# No `destination`: the site builds into pkgdown's default docs/, which
# fleet-ci's `pages` job publishes (design/agent-workflow.md).

template:
  bootstrap: 5

home:
  title: "ssrfr"

reference:
  - title: Fetch through the guard
    contents:
      - ssrf_prepare_hop
      - ssrf_fetch
      - ssrf_fetch_chain
  - title: Inspect a URL
    contents:
      - ssrf_inspect_url
  - title: Policy
    contents:
      - ssrf_policy
  - title: Results and vocabularies
    contents:
      - ssrf_public_reason
      - ssrf_vocabulary

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, gitlab]
  components:
    # pkgdown ships a built-in `github` component but none for GitLab, so this
    # is a plain custom component using the Font Awesome brand icon pkgdown
    # already bundles.
    gitlab:
      icon: fab fa-gitlab
      href: https://gitlab.com/bart-turczynski/ssrfr
      aria-label: GitLab
