# The fleet-ci local gate's settings: T0 (docs) and T1 (full) before every
# push, run by .fleet-ci/gate in the fleet image (fleet-ci README, "The
# .fleet-ci.yml file"; seor ADR 0012). Read from the pushed commit. The
# t2-locale and pages CI jobs read it too.
version: 1

# The image the gate runs in. It must be .gitlab-ci.yml's
# FLEET_RELEASE_VARIANT (default fleet-r).
variant: fleet-r

# No docs_exclude: no full-tier gate reads a docs-allowlisted path. The
# docs tier's own check_pkgdown() reads _pkgdown.yml, and the pre-push hooks
# that read _pkgdown.yml or design/**/*.md (scripts/check-bugreports.py,
# scripts/check-design.py) run on every push whatever the tier.

# T0, and the start of T1. Genuine terms go in inst/WORDLIST (SEOR-mtbzfroz).
docs_gates:
  - Rscript scripts/check-spelling.R

# T1, in the container after the dependency install, each run whatever the
# others report: man/, NAMESPACE and DESCRIPTION against a fresh roxygen2
# run (SEOR-nwfmerhu), lintr, README.md against a fresh knit, the NEWS
# heading against the version, and every declared URL (the gate's R CMD
# check runs with remote incoming, and so its URL check, off; t2-ascran
# runs it with incoming on).
cheap_gates:
  - Rscript scripts/check-docs-drift.R .
  - Rscript -e 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }'
  - sh scripts/check-readme-drift.sh
  - Rscript scripts/check-news-version.R
  - Rscript scripts/check-urls.R

# test-locale.R (REQ-094) runs a leg for each hostile locale the machine
# has. The gate runs as the invoking user, so it compiles these into its own
# LOCPATH, where glibc finds no other: every locale the checks or the
# assertion use is listed. CI's t2-locale builds the same list.
#
# Not listed: the Latin-5 legs, tr_TR.ISO8859-9 and tr_TR.iso88599. Both the
# gate and t2-locale take the charmap from the name after the dot, and glibc
# has no charmap "ISO8859-9" (it is "ISO-8859-9"): the gate's locale is then
# unusable, and t2-locale's is accepted with an ASCII codeset, a leg that is
# not Latin-5. They return once fleet-ci can build them
# (design/agent-workflow.md, "Gaps accepted in the fleet-ci migration").
locales:
  - tr_TR.UTF-8
  - az_AZ.UTF-8
  - lt_LT.UTF-8

# The leg the assertion follows: one more check, here and in t2-locale,
# under C.UTF-8, the session locale of the former CI, rather than the
# default C. Under C the session charset is ASCII, R cannot translate the
# test files' UTF-8 literals, and two tests fail (test-resolve.R:155 among
# them); the hostile locales run inside test-locale.R whatever the leg.
# The leg repeats the gate's own check, which already runs under C.UTF-8:
# it exists so the locale assertion has a leg to follow, until fleet-ci
# v1.2.0 lets the restored Latin-5 legs take its place.
locale_legs:
  - C.UTF-8

# The positive locale assertion: callr present and every hostile locale
# usable, so test-locale.R cannot pass having run no hostile leg. Run after
# the locale leg's check, here and in t2-locale.
locale_assertions:
  - Rscript scripts/check-locale-legs.R

# The gate runs R CMD check with NOT_CRAN=true, so skip_on_cran() no longer
# keeps these out of it. T2 runs both, as osv-audit and security-audit.
exclude_tests:
  - path: tests/testthat/test-osv.R
    why: queries osv.dev over the network; the osv-audit job runs it in T2
  - path: tests/testthat/test-security.R
    why: queries Sonatype OSS Index with credentials the gate does not have; the security-audit job runs it in T2

# Every skip R CMD check's test run may report; any other fails the gate. A
# skipped test fails, as an expectation-free one does (ssrfr-v1.md §7.2), so
# the list is empty.
allowed_skips: []

# The top-level .md files the pkgdown site publishes; every other one (the
# agent files among them) is moved out before build_site()
# (design/agent-workflow.md, "The Pages keep-list").
pages_keep:
  - README.md
  - NEWS.md
  - LICENSE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
