# Overrides the shared config, whose `verify` hook wraps the command in a bash
# invocation that breaks on R's double quotes. Here every R hook is a script
# run by Rscript, so no shell quoting is involved. What each hook guards, and
# how CI mirrors it: design/agent-workflow.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
      - id: check-case-conflict
  # Air (https://posit-dev.github.io/air/) formats R sources on commit. The
  # hook bootstraps its own R-free binary, so no global install is needed.
  # Air owns layout; the `verify` lintr stage below owns logic lints.
  # Only Air >= 0.8.2 can be pinned as a pre-commit rev.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.8.2
    hooks:
      - id: air-format
        exclude: ^design/evidence/
  # British spellings in code, comments, string literals, test names, fixture
  # notes, tooling and design prose, which spelling::spell_check_package() (the
  # `spelling` hook below) never reads: it covers DESCRIPTION, roxygen,
  # vignettes, README and NEWS only (SEOR-xtmnpmae; seor design/fleet.md
  # "Prose language"). Only the en-GB_to_en-US dictionary is enabled, so this
  # is not a general typo checker. codespell skips dotfiles unless given
  # --check-hidden.
  #
  # Ignored word: mitre, since MITRE (CWE, CAPEC) is a proper name and its
  # domain appears in source URLs.
  #
  # Excluded, each because its bytes are not ours to respell:
  #   man/ -- roxygen output; fix the roxygen source in R/ and regenerate.
  #   design/evidence/ -- recorded tool output and probes; editing them makes
  #     the record disagree with the run it cites.
  #   design/adr/0001-network-safety-policy.md, 0003-one-normative-spec.md --
  #     accepted ADRs are frozen (scripts/check-design.py). A later status
  #     change to `superseded` would otherwise trip this hook.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US, --ignore-words-list, mitre]
        stages: [pre-commit, pre-push]
        exclude: '^(man/|design/evidence/|design/adr/0001-network-safety-policy\.md$|design/adr/0003-one-normative-spec\.md$)'
  - repo: local
    hooks:
      - id: check-design
        name: design-doc hygiene
        entry: python3 scripts/check-design.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports keeps the /-/issues form R's incoming check
      # asks for, and every human-facing tracker link uses /-/work_items
      # (SEOR-ocbtrrnl). Vendored from pslr; stdlib-only and offline. The
      # script's docstring says why the two forms must differ.
      - id: check-bugreports
        name: BugReports split (DESCRIPTION vs human-facing tracker links)
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-bugreports-self-test
        name: check-bugreports self-test
        entry: python3 scripts/check-bugreports.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-bugreports\.py$
        stages: [pre-push]
      # Quick (one request, for CRAN's package index, which the check for a
      # dependency older than CRAN's reads: SEOR-hxxxkmws), and ahead of
      # `verify` on purpose: toolchain drift
      # turns the gate red on an untouched tree, disguised as a code defect,
      # and this names the machine as the cause in one line (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
      # release DESCRIPTION's Version points at; a package that never released
      # carries the development version verbatim and no DOI. Vendored from
      # seor (its design/adr/0001); offline and stdlib-only. CI runs it in the
      # `citation-version` job.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Fetches every URL the package declares (DESCRIPTION, man/,
      # inst/CITATION, NEWS, README.md) and fails on a dead one, in seconds
      # rather than after `verify`'s full check. A URL that cannot be reached
      # at all only warns, so a network blip never rejects a push; zero URLs
      # checked fails; the only exemption is BugReports' /-/issues URL
      # answering exactly 404 (SEOR-ocbtrrnl). The fleet standard's URL check,
      # copied from punycoder's.
      - id: check-urls
        name: declared URLs resolve
        entry: Rscript scripts/check-urls.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # man/, NAMESPACE and DESCRIPTION in the pushed commit (PRE_COMMIT_TO_REF,
      # else HEAD) against a fresh roxygen2 run in a `git archive` export of it
      # (SEOR-nwfmerhu). A stale .Rd is valid .Rd, so nothing else here sees it.
      # Ahead of `spelling`, which reads man/ as it is. The script's header says
      # why it never runs in the working tree. Local only: CI's `gates` job has
      # no roxygen2.
      - id: docs-drift
        name: generated docs (man/, NAMESPACE) match roxygen
        entry: bash scripts/check-docs-drift.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # R CMD check skips DESCRIPTION spelling on a machine with no English
      # dictionary; `spelling` bundles its own (SEOR-mtbzfroz). Genuine terms
      # go in inst/WORDLIST. Seconds, so it runs ahead of `verify`.
      - id: spelling
        name: spelling (en-US, inst/WORDLIST)
        entry: Rscript scripts/check-spelling.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # The same file the CI `verify` job runs. Its stages, including the
      # NOT_CRAN=true test run that fails on skipped or expectation-free tests
      # (ssrfr-v1.md §7.2), are listed in its header.
      - id: verify
        name: verify (mirrors CI)
        entry: Rscript scripts/verify.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
