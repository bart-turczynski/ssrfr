# CI for ssrfr, an R package.
#
# Ported from the reference sibling seor and the shared R template in the
# boilerplate generator; the reasoning behind the shape is in seor's ADRs
# 0003 (cache), 0004 (CRAN incoming) and 0005 (one gate job). Read
# design/agent-workflow.md before reshaping this file.
#
# The fast gate is `verify`, running scripts/verify.R: the same file the
# pre-push hook runs, so CI and the local gate cannot drift apart. lint and
# news-version are stages of that script. The other cheap gates of seor's
# design/fleet-standard.md run in `gates` (README drift, spelling) and
# `citation-version` (CITATION.cff and .zenodo.json against DESCRIPTION, and
# the BugReports split). The deep checks and the dependency audits run only on
# their own pipeline schedules, and `fossa` on every push to main.

stages:
  - verify
  - check
  - pages
  - maintenance

default:
  interruptible: true
  # Every job names the runner pool it depends on, so none falls back to
  # shared runners (seor-local-docker carries this tag; SEOR-hhtzaknn).
  tags: [local-docker]

# --------------------------------------------------------------------------
# Shared R setup
#
# rocker/verse would carry R, pandoc and TeX in a single image, but it is
# published amd64-only — on an arm64 runner that means every R compile runs
# under QEMU. rocker/r-ver is multi-arch, so take that and add the toolchain by
# hand.
# --------------------------------------------------------------------------

.r:
  # The tag lives in R_VERSION, not in the image line, because the cache key
  # below needs it too. full-check's matrix overrides R_VERSION per leg; every
  # other R job runs this default. Renovate's gitlabci manager cannot read a
  # tag through a variable, so renovate.json carries a regex manager for the
  # commented line instead.
  image: rocker/r-ver:$R_VERSION
  variables:
    # renovate: datasource=docker depName=rocker/r-ver
    R_VERSION: "4.6.1"
    # CI runners drop the image's LANG, so R falls back to the C locale and
    # reads any UTF-8 byte back with "bytes" encoding; lintr then dies parsing
    # its own config.
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    # Rd2pdf defaults to "times,inconsolata,hyper", and inconsolata.sty ships
    # only in texlive-fonts-extra (~1 GB, not installed below). Without this
    # the PDF manual step WARNs and the verify gate fails on it.
    R_RD4PDF: "times,hyper"
    # GitLab caches only paths under $CI_PROJECT_DIR. Setting R_LIBS_USER is
    # NOT enough on its own: rocker's Renviron.site puts site-library first and
    # R installs into the first writable entry. The .libPaths() line in
    # before_script is what actually moves the install target (seor ADR 0003).
    R_LIBS_USER: "$CI_PROJECT_DIR/.r-lib"
    # pak's download directory, inside the checkout for the same reason. That
    # rules out `local::.` in any pak call: pak would copy the tree into a
    # subdirectory of itself and fail. Jobs install the dependency closure,
    # Suggests included, with pak::local_install_deps(), which copies nothing,
    # and the package itself, where a job needs it, with `R CMD INSTALL`.
    PKG_CACHE_DIR: "$CI_PROJECT_DIR/.pak-cache"
    # rocker/r-ver bakes a frozen p3m snapshot into Rprofile.site at image
    # build time, so anything newer on CRAN "does not exist". before_script
    # replaces it with this date plus a CRAN fallback. Pinned so rebuilding an
    # old commit resolves the same binaries; bump it when you bump R_VERSION.
    P3M_SNAPSHOT: "2026-09-01"
    # The pslr commit .install-deps pins until CRAN serves the fixed pslr.
    PSLR_SHA: "f322d57517c1dc5d070c0260648fa6cc58786c3f"
  cache:
    # Keyed on DESCRIPTION, the closest thing an R package has to a lockfile,
    # and on R_VERSION, because a compiled package only loads under the R it
    # was built for.
    key:
      prefix: "r-$R_VERSION"
      files:
        - DESCRIPTION
    paths:
      - .r-lib
      - .pak-cache
  before_script:
    - mkdir -p "$R_LIBS_USER" "$PKG_CACHE_DIR"
    # The key cannot see a re-pushed image tag, and a cached library of
    # binaries is valid only for the R and base image that built it. So record
    # what built it and discard it when that no longer matches (SEOR-huidaviw).
    - |
      stamp="$R_LIBS_USER/.toolchain-stamp"
      . /etc/os-release
      want="$(Rscript -e 'cat(R.version$major, R.version$minor, R.version$platform, sep = "-")')-${ID}-${VERSION_ID}"
      have="$(cat "$stamp" 2>/dev/null || echo none)"
      if [ "$have" != "$want" ]; then
        echo "cache: built by '$have', this job is '$want' -- discarding the cached library"
        rm -rf "$R_LIBS_USER" "$PKG_CACHE_DIR"
        install -d "$R_LIBS_USER" "$PKG_CACHE_DIR"
        printf '%s' "$want" > "$stamp"
      else
        echo "cache: '$want' matches the cached library -- keeping it"
      fi
    # p3m first, so packages arrive as prebuilt binaries; CRAN behind it as a
    # source-only fallback for what p3m has not synced yet. Appended, so the
    # later options() call wins and rocker's HTTPUserAgent line survives. p3m's
    # binary path is amd64-only, so arm64 falls back to the source repository.
    - |
      . /etc/os-release
      repo="https://p3m.dev/cran/__linux__/${UBUNTU_CODENAME}/${P3M_SNAPSHOT}"
      if [ "$(uname -m)" = "aarch64" ]; then
        repo="https://p3m.dev/cran/${P3M_SNAPSHOT}"
      fi
      echo "options(repos = c(P3M = '${repo}', CRAN = 'https://cloud.r-project.org'))" \
        >> "${R_HOME}/etc/Rprofile.site"
      # Put the cached library FIRST so installs land in it (see R_LIBS_USER).
      echo '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))' \
        >> "${R_HOME}/etc/Rprofile.site"
      Rscript -e 'cat("Effective repos:\n"); print(getOption("repos"))' \
        -e 'cat("Library paths:\n"); print(.libPaths())'
    - apt-get update -qq
    # git because pak and covr shell out to it; LaTeX and qpdf for the
    # `--as-cran` PDF manual; HTML Tidy (5.0.0 or later; noble ships 5.6.0) so
    # the check validates the HTML manual as CRAN does, rather than skipping
    # it; the -dev headers for source compiles on a runner p3m serves no
    # binaries for.
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      curl ca-certificates git
      pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-recommended qpdf
      tidy
      libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev zlib1g-dev
      libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev
      libpng-dev libtiff5-dev libjpeg-dev
    # rocker/r-ver (4.5.1 and 4.4.3, as probed) generates only C.UTF-8 and
    # en_US.UTF-8, and tests/testthat/test-locale.R (REQ-094) runs a leg only
    # for each of its Turkish, Azeri and Lithuanian locales the machine has.
    # So build all four (tr_TR.ISO8859-9 and tr_TR.iso88599 name one), register
    # them in /etc/locale.gen so a later locale-gen keeps them, and check that R can switch to each and that
    # tr_TR.UTF-8 folds "I" to dotless "ı". The image ships the locales package
    # that localedef reads; on the probed tags, naming it in the install line
    # above upgraded glibc under R. The session locale stays C.UTF-8 (LANG and
    # LC_ALL above).
    - localedef -i tr_TR -f UTF-8 tr_TR.UTF-8
    - localedef -i tr_TR -f ISO-8859-9 tr_TR.ISO8859-9
    - localedef -i az_AZ -f UTF-8 az_AZ.UTF-8
    - localedef -i lt_LT -f UTF-8 lt_LT.UTF-8
    - >
      printf '%s\n' 'tr_TR.UTF-8 UTF-8' 'tr_TR.ISO-8859-9 ISO-8859-9'
      'az_AZ.UTF-8 UTF-8' 'lt_LT.UTF-8 UTF-8' >> /etc/locale.gen
    - >
      Rscript -e 'for (l in c("tr_TR.UTF-8", "tr_TR.ISO8859-9", "tr_TR.iso88599", "az_AZ.UTF-8", "lt_LT.UTF-8")) if (!nzchar(Sys.setlocale("LC_CTYPE", l))) stop("R cannot use locale ", l)'
      -e 'invisible(Sys.setlocale("LC_CTYPE", "tr_TR.UTF-8")); stopifnot(tolower("I") == intToUtf8(0x131L)); cat("hostile locales usable in R\n")'
    # pak from r-lib's own binary repository, not CRAN: rocker/r-ver:devel has
    # no binaries, so a CRAN install builds pak from source and can fail with
    # only a warning (punycoder's full-check R-devel, pipeline 2894951198).
    - >
      Rscript -e 'if (!requireNamespace("pak", quietly = TRUE))
      install.packages("pak", repos = sprintf(
      "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
      .Platform$pkgType, R.Version()$os, R.Version()$arch))'

# --------------------------------------------------------------------------
# workflow — keep only the pipeline on main
#
# A branch push and a merge request create NO pipeline; only a tag, a push to
# main, or a hand-started (`web`) pipeline does. On the fleet's self-hosted
# runners the branch and MR pipelines held runner slots while main's waited,
# and died or ran against trees nobody could act on (SEOR-bmgkzhvy). So on a
# feature branch the pre-push `verify` hook is the only gate, and an empty
# pipeline list is not a pass. To get a server-side answer on a branch, start
# one by hand at Build > Pipelines > Run pipeline.
# --------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # The escape hatch: a human chose a ref under Run pipeline, so this never
    # fires on its own.
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

.on-main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

.scheduled-or-manual:
  rules:
    # A scheduled run is BLOCKING: a detector that reports success when it
    # fires is worthless. Only a schedule that sets SCHEDULE_KIND=deep-check
    # (a variable on the schedule itself, never a project or group variable,
    # which every schedule would inherit) runs these jobs;
    # any other schedule falls to the explicit `when: never` below, so adding
    # a schedule for another purpose cannot start them (SEOR-ihmntqzm).
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "deep-check"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Under `rules`, `when: manual` defaults to `allow_failure: false`, which
    # would leave a hand-started pipeline blocked on a job nobody meant to gate
    # on. Load-bearing.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# The two dependency audits (osv-audit, security-audit) run only on a schedule
# that sets SCHEDULE_KIND=dependency-audit, or by hand from a `web` pipeline,
# never otherwise (seor SEOR-fftbjnpl). A schedule pipeline on main is
# admitted by the `workflow:` rules through the default-branch rule.
.dependency-audit:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "dependency-audit"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: never

# --------------------------------------------------------------------------
# install-deps — the dependency closure, shared by every job that installs it
#
# TEMPORARY pslr pin. pslr 1.2.1, the CRAN release, fails to load the public
# suffix list under a Turkish or Azeri locale on glibc (tolower("ICANN") is
# "ıcann"), so every rurl parse fails and test-locale.R goes red here
# (SSRF-bglihtwb). The fix is pslr !67, merged as f322d57; it reaches CRAN no
# earlier than 2026-11-14. Until then the jobs install pslr from that commit,
# after the CRAN closure so nothing replaces it, and fail if another pslr is
# what loads. DESCRIPTION is untouched: the pin is CI-only. So is the fix, for
# the local gate: on glibc with these locales, install the same commit first,
# or test-locale.R fails on an untouched tree. (macOS keeps "I" as "i", so the
# bug never shows there.) Once CRAN serves the fixed pslr, remove this block's
# last two steps, PSLR_SHA in .r and this comment (SSRF-mspjpegk).
# --------------------------------------------------------------------------

.install-deps:
  script: &install-deps
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pak(paste0("gitlab::bart-turczynski/pslr@", Sys.getenv("PSLR_SHA")))'
    - >
      Rscript -e 'd <- packageDescription("pslr"); cat("pslr", d$Version, "from", d$RemoteSha, "\n")'
      -e 'if (!identical(d$RemoteSha, Sys.getenv("PSLR_SHA"))) stop("pslr is not the pinned commit")'

# --------------------------------------------------------------------------
# verify — the fast gate
# --------------------------------------------------------------------------

# lintr and rcmdcheck are development tooling, not DESCRIPTION dependencies, so
# they are installed separately from the package's own closure.
verify:
  extends:
    - .r
    - .on-main
  stage: verify
  script:
    - Rscript -e 'pak::pak(c("any::lintr", "any::rcmdcheck"))'
    - *install-deps
    - Rscript scripts/verify.R

# README drift and spelling, run by scripts/gates.sh, which runs both and then
# names every failure in one VERDICT line. Neither needs the package's
# dependency closure: README.Rmd evaluates no package code, and
# spelling::spell_check_package() reads the sources.
#
# pandoc is PINNED, as in punycoder and pagerankr: its markdown writer reflows
# text between versions, so README.md is byte-stable only under the pandoc that
# knit it, 3.10. The apt pandoc (3.1.x) would report drift that is not there.
# Bump it only together with a re-knit of README.md.
gates:
  extends:
    - .r
    - .on-main
  stage: verify
  script:
    - PANDOC_VERSION=3.10
    - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-$(dpkg --print-architecture).deb"
    - dpkg -i /tmp/pandoc.deb
    - pandoc --version | head -n1
    - Rscript -e 'pak::pak(c("any::rmarkdown", "any::knitr", "any::spelling"))'
    - sh scripts/gates.sh

# CITATION.cff and .zenodo.json each duplicate the version and the project URLs
# out of DESCRIPTION; scripts/check-citation.py, vendored from seor, holds them
# to it. The BugReports split rides along (SEOR-ocbtrrnl). Offline,
# stdlib-only Python, so it runs on a small python image rather than the R one.
citation-version:
  extends: .on-main
  stage: verify
  image: python:3.14-alpine
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py
    - python3 scripts/check-bugreports.py --self-test
    - python3 scripts/check-bugreports.py

# --------------------------------------------------------------------------
# check — the slower passes
# --------------------------------------------------------------------------

# Coverage, reported through GitLab natively: the `coverage:` regex drives the
# badge and the cobertura artifact drives per-line annotations in the diff.
coverage:
  extends:
    - .r
    - .on-main
  stage: check
  script:
    - Rscript -e 'pak::pak(c("any::covr", "any::xml2"))'
    - *install-deps
    # Fails below 95% total coverage, the fleet minimum (seor
    # design/fleet-standard.md, ADR 0007). cobertura.xml is written first, so
    # a failing run still annotates the diff. The threshold is never lowered:
    # a package under it adds tests.
    - >
      Rscript -e 'cov <- covr::package_coverage(quiet = FALSE);
      print(cov);
      covr::to_cobertura(cov);
      pct <- covr::percent_coverage(cov);
      if (pct < 95) stop(sprintf("total coverage %.2f%% is below the fleet minimum of 95%%; add tests, never lower the threshold", pct), call. = FALSE)'
  coverage: '/Coverage:\s*(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# The R-version axis, on Linux only: GitLab.com's macOS and Windows runners are
# paid tiers, so the rest moves to R-hub (`rhub::rc_submit()`) before a CRAN
# submission.
#
# The legs are the fleet standard's deep-check set (seor
# design/fleet-standard.md): R release, oldrel and devel here, plus the R
# floor in `floor-check` below. Bump the pinned release and oldrel tags when a
# new minor R version ships. `needs: []` starts every deep-check job when the
# pipeline starts, so a red `verify` on the same schedule cannot skip them.
full-check:
  extends:
    - .r
    - .scheduled-or-manual
  stage: check
  needs: []
  parallel:
    matrix:
      - R_VERSION: ["4.6.1", "4.5.1", "devel"]
  script:
    - Rscript -e 'pak::pak(c("any::lintr", "any::rcmdcheck"))'
    - *install-deps
    - Rscript scripts/verify.R

# The deep-check leg at the declared R floor, `Depends: R (>= 4.1.0)`.
#
# 4.1 is the floor rurl (through pslr) and raddr need, and the oldest minor
# with an arm64 rocker/r-ver image (4.1.3). pagerankr's `floor-check` is the
# model:
#
# - Packages come from one dated Posit Package Manager snapshot,
#   FLOOR_SNAPSHOT, used in this job alone, so it cannot conflict with what
#   full-check's release and devel legs install. 2025-04-10 is the day before
#   R 4.5.0, when R 4.1 was still inside these dependencies' support window.
# - What postdates the snapshot comes from CRAN itself, without dependencies,
#   after its own dependencies came from the snapshot: the fleet packages
#   (rurl, raddr, pslr, punycoder), curl (ssrfr needs >= 7.0.0; the snapshot
#   has 6.2.2), and rlang and vctrs (raddr needs rlang >= 1.1.7 and vctrs >=
#   0.7.0). Measured 2026-10-03 against both repositories: that closure has
#   no version conflict, and no package in it declares an R floor above 4.1.3.
# - Only what the check needs is installed: the hard dependencies, the test
#   and vignette Suggests, and rcmdcheck. oysteR and rosv serve the scheduled
#   audits, whose tests skip without them, so _R_CHECK_FORCE_SUGGESTS_=false
#   lets --as-cran report them as a NOTE instead of stopping.
# - Vignettes are neither built nor checked, as in pagerankr and punycoder.
# - No hostile locales are built, so test-locale.R skips its legs here.
#
# The image tag is a variable so Renovate's gitlabci manager cannot bump the
# floor to a current R. Its own before_script and cache: the shared `.r`
# setup rewrites repos for the release image, which this job must not use.
#
# BEST EFFORT. Nothing here could be run before it merged. rocker/r-ver:4.1.3
# is Ubuntu focal, whose libcurl is 7.68.0, below DESCRIPTION's
# `SystemRequirements: libcurl (>= 7.73.0)`, so a transport test may fail
# here for libcurl, not R. The leg is allow_failure until its first green run
# on the deep-check schedule; drop allow_failure then, as seor's floor-check
# says (SEOR-kqcbgsfc).
floor-check:
  extends: .scheduled-or-manual
  stage: check
  needs: []
  image: rocker/r-ver:$R_FLOOR_VERSION
  allow_failure: true
  variables:
    R_FLOOR_VERSION: "4.1.3"
    FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2025-04-10"
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    _R_CHECK_FORCE_SUGGESTS_: "false"
    R_LIBS_USER: "$CI_PROJECT_DIR/.cache/R-floor"
    R_LIBS: "$CI_PROJECT_DIR/.cache/R-floor:/usr/local/lib/R/site-library:/usr/local/lib/R/library"
  cache:
    key: floor-r41-2025-04-10
    paths:
      - .cache/R-floor
  before_script:
    - mkdir -p "$R_LIBS_USER"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends pkg-config libcurl4-openssl-dev libssl-dev zlib1g-dev
    - >
      Rscript -e 'snap <- c("cli", "glue", "lifecycle", "stringi", "digest", "Rcpp", "cpp11",
      "callr", "cucumber", "httpuv", "knitr", "pkgload", "processx", "rmarkdown",
      "testthat", "webfakes", "withr", "rcmdcheck");
      need <- setdiff(snap, rownames(installed.packages()));
      if (length(need)) install.packages(need, repos = Sys.getenv("FLOOR_SNAPSHOT"), Ncpus = 4L);
      install.packages(c("rlang", "vctrs", "curl", "punycoder", "pslr", "rurl", "raddr"),
      repos = "https://cloud.r-project.org", dependencies = FALSE, Ncpus = 4L);
      stopifnot(all(vapply(c("curl", "raddr", "rurl", "testthat", "rcmdcheck"), requireNamespace, NA, quietly = TRUE)));
      stopifnot(packageVersion("curl") >= "7.0.0");
      print(R.version.string); print(curl::curl_version()$version)'
    # rcmdcheck reads a check that halted partway as 0/0/0 and returns
    # normally, so error_on never fires; the guard also fails on R CMD check's
    # own exit status (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
      build_args = c("--no-manual", "--no-build-vignettes"),
      error_on = "warning", check_dir = "check");
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    paths:
      - check/
    expire_in: 1 week

# --------------------------------------------------------------------------
# pages — the pkgdown site
#
# A job named exactly `pages` that leaves its output in `public/` is published.
# _pkgdown.yml builds into site/, so the job renames at the end. Keep `url:` in
# _pkgdown.yml in step with the project's Pages address.
# --------------------------------------------------------------------------

pages:
  extends: .r
  stage: pages
  needs:
    - verify
    - coverage
  rules:
    # Pinned to the default branch: `pages` publishes rather than reports, so
    # a hand-started pipeline on a feature branch must not reach it.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # build_site(install = FALSE) renders against the installed package.
    - Rscript -e 'pak::pak("any::pkgdown")'
    - *install-deps
    - R CMD INSTALL --library="$R_LIBS_USER" .
    # pkgdown renders EVERY top-level .md, so agent instruction files would be
    # published as AGENTS.html, CLAUDE.html and so on. KEEP is a keep-list, not
    # a deny-list: every top-level .md not named here is moved out first, so a
    # new agent file of any name stays private by default, and a new public
    # page is not published until it is added here (design/agent-workflow.md).
    # A kept file that goes missing fails the job.
    - |
      set -eu
      KEEP="README.md NEWS.md LICENSE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md"
      for f in $KEEP; do
        if [ ! -f "$f" ]; then
          echo "ERROR: expected top-level file '$f' is missing -- update KEEP in .gitlab-ci.yml or restore the file." >&2
          exit 1
        fi
      done
      mkdir -p /tmp/agent-md
      for f in *.md; do
        case " $KEEP " in
          *" $f "*) : ;;
          *) mv "$f" /tmp/agent-md/ ;;
        esac
      done
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'
    - rm -rf public && mv site public
  artifacts:
    paths:
      - public

# --------------------------------------------------------------------------
# maintenance — scheduled or on demand
#
# GitLab keeps pipeline schedules in project settings (CI/CD > Schedules), not
# in this file. A schedule runs renovate only when it sets
# SCHEDULE_KIND=deep-check (.scheduled-or-manual), and the two audits only when
# it sets SCHEDULE_KIND=dependency-audit (.dependency-audit). `needs: []`
# starts each job when the pipeline starts, so a red earlier job cannot skip
# it. `fossa` is the one job here that runs on a push to main.
# --------------------------------------------------------------------------

# Dependency vulnerability audit against the OSV database (https://osv.dev) via
# {rosv}. Needs no account, token or CI/CD variable. Runs
# tests/testthat/test-osv.R against the runtime dependency closure at the
# installed versions. NOT_CRAN=true so skip_on_cran() in the test cannot skip
# the audit silently.
osv-audit:
  extends:
    - .r
    - .dependency-audit
  stage: maintenance
  needs: []
  variables:
    NOT_CRAN: "true"
  script:
    - Rscript -e 'pak::pak(c("any::rosv", "any::testthat"))'
    - *install-deps
    - Rscript -e 'testthat::test_local(filter = "osv", stop_on_failure = TRUE)'

# Dependency vulnerability audit against the Sonatype OSS Index via {oysteR}.
# Runs tests/testthat/test-security.R, which audits the hard dependencies
# (Depends + Imports) and judges every reported advisory against the
# allow-list in tests/testthat/helper-security.R. OSS Index rejects anonymous
# requests with HTTP 401, so this job needs two CI/CD variables, both set on
# this project:
#   OSSINDEX_USER   - the literal placeholder `x`, NOT the account email
#   OSSINDEX_TOKEN  - a Sonatype Guide personal access token (`sonatype_pat_*`)
#
# THIS JOB FAILS WHEN THEY ARE ABSENT, ON PURPOSE (seor SEOR-fkvlzltx):
# OSSINDEX_AUDIT_REQUIRED turns each precondition the test would otherwise
# skip on into a failure naming what is missing, so the job cannot report
# success having audited nothing. It is set here and nowhere else.
security-audit:
  extends:
    - .r
    - .dependency-audit
  stage: maintenance
  needs: []
  variables:
    NOT_CRAN: "true"
    OSSINDEX_AUDIT_REQUIRED: "true"
  script:
    - Rscript -e 'pak::pak(c("any::oysteR", "any::testthat"))'
    - *install-deps
    - Rscript -e 'testthat::test_local(filter = "security", stop_on_failure = TRUE)'

# FOSSA license and security scan (seor design/fleet-standard.md, "FOSSA":
# ssrfr is one of the three FOSSA packages). Runs on a push to main, uploads to
# FOSSA and feeds the README's slot-17 badges; the first run creates the
# project. FOSSA_API_KEY is a masked CI/CD variable only the owner holds, so
# the job fails, rather than skipping green, when it is missing. The CLI comes
# from FOSSA's official install script, which ships linux/arm64 builds for
# this runner. The pipeline is a detached checkout, so the branch and revision
# are passed rather than inferred. Copied from seor's `fossa` job.
fossa:
  stage: maintenance
  image: debian:bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test -n "${FOSSA_API_KEY:-}" || { echo "FOSSA_API_KEY is not set on this project; fossa analyze cannot upload."; exit 1; }
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl ca-certificates git
    - >
      curl -fsSL -H 'Cache-Control: no-cache'
      https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | sh
    - fossa analyze --branch "$CI_COMMIT_BRANCH" --revision "$CI_COMMIT_SHA"

# Renovate bumps the CI images (renovate.json). Needs a RENOVATE_TOKEN CI/CD
# variable: a personal access token with `api` and `write_repository` scope.
# Project access tokens need GitLab Premium, and this namespace is Free
# (SEOR-tzxuisnf).
renovate:
  extends: .scheduled-or-manual
  stage: maintenance
  needs: []
  image: renovate/renovate:41
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    # Skip loudly rather than fail when the token is missing: a red scheduled
    # pipeline for a setup step nobody has done yet is noise. Every other
    # renovate failure fails the job.
    - |
      if [ -z "${RENOVATE_TOKEN:-}" ]; then
        echo "RENOVATE_TOKEN is not set - skipping renovate."
        echo "Add it under Settings > CI/CD > Variables: a personal access token"
        echo "with 'api' and 'write_repository' scope."
        exit 0
      fi
    - renovate
