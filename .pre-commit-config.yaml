# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref, then this file's pre-push
# stage. The gate itself, spelling, docs drift, lintr, README drift, the NEWS
# heading, the URL check and R CMD check, is in .fleet-ci.yml, never here:
# this file must not run .fleet-ci/gate (fleet-ci README, "The local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
#
# Every R hook is a script run by Rscript, so no shell quoting is involved.
# What each hook guards: design/agent-workflow.md.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it. So
      # no fixer, formatter or speller here touches it.
      - id: end-of-file-fixer
        exclude: &vendored '^\.fleet-ci/'
      - id: trailing-whitespace
        exclude: *vendored
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        exclude: *vendored
      - id: check-case-conflict
  # Air (https://posit-dev.github.io/air/) formats R sources on commit. The
  # hook bootstraps its own R-free binary, so no global install is needed.
  # Air owns layout; the gate's lintr (.fleet-ci.yml) owns logic lints.
  # Only Air >= 0.8.2 can be pinned as a pre-commit rev.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format
        exclude: ^(design/evidence/|\.fleet-ci/)
  # British spellings in code, comments, string literals, test names, fixture
  # notes, tooling and design prose, which spelling::spell_check_package() (the
  # gate's spelling check, .fleet-ci.yml) never reads: it covers DESCRIPTION, roxygen,
  # vignettes, README and NEWS only (SEOR-xtmnpmae; seor design/fleet.md
  # "Prose language"). Only the en-GB_to_en-US dictionary is enabled, so this
  # is not a general typo checker. codespell skips dotfiles unless given
  # --check-hidden.
  #
  # Ignored word: mitre, since MITRE (CWE, CAPEC) is a proper name and its
  # domain appears in source URLs.
  #
  # Excluded, each because its bytes are not ours to respell:
  #   man/ -- roxygen output; fix the roxygen source in R/ and regenerate.
  #   design/evidence/ -- recorded tool output and probes; editing them makes
  #     the record disagree with the run it cites.
  #   design/adr/0001-network-safety-policy.md, 0003-one-normative-spec.md --
  #     accepted ADRs are frozen (scripts/check-design.py). A later status
  #     change to `superseded` would otherwise trip this hook.
  #   .fleet-ci/ -- fleet-ci's bin/vendor output (see the fixers above).
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US, --ignore-words-list, mitre]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|design/evidence/|design/adr/0001-network-safety-policy\.md$|design/adr/0003-one-normative-spec\.md$)'
  - repo: local
    hooks:
      - id: check-design
        name: design-doc hygiene
        entry: python3 scripts/check-design.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports:, codemeta.json and every tracker link
      # (.bestpractices.json, CONTRIBUTING.md, SECURITY.md) name /-/work_items,
      # and no human-facing file may carry a /-/issues link (seor ADR 0011).
      # Ported from seor's v2; stdlib-only and offline.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-bugreports-self-test
        name: check-bugreports self-test
        entry: python3 scripts/check-bugreports.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-bugreports\.py$
        stages: [pre-push]
      # Every top-level NEWS.md bullet is one terse line: one source line, at
      # most 32 words besides one trailing reference, no housekeeping and no
      # Internal section (seor design/fleet-standard.md, "NEWS.md bullets").
      # Ported from seor byte for byte; stdlib-only and offline.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # Refuses the push when this clone's pre-push hook is not fleet-ci's,
      # so the push would run without the gate (SEOR-gksaxuoz). It only
      # reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or README knit writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
      # release DESCRIPTION's Version points at; a package that never released
      # carries the development version verbatim and no DOI. Vendored from
      # seor (its design/adr/0001); offline and stdlib-only. CI runs it in the
      # `citation-version` job of every T2 and T3 pipeline.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
