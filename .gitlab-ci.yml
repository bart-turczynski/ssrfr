# GitLab CI for ssrfr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and settings, and adds its x-* jobs. A push to main or a branch, and a
# merge request, create no pipeline: the merge gate is the local one
# (.fleet-ci/gate, run by the .fleet-ci/pre-push hook). T2 runs on the
# deep-check schedule (SCHEDULE_KIND=deep-check), T3 on a RELEASE=1 web
# pipeline and a v* tag. design/agent-workflow.md has the whole picture.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 162f35db568426a44d796593c1c25955a9b2add3
    file: templates/r-package.yml

variables:
  # ssrfr has no compiled code (no src/), which the sanitizer leg exists for.
  FLEET_SANITIZERS: "false"
  # The template's t2-floor installs every dependency from one dated
  # snapshot, and ssrfr's floor closure cannot come from one: curl (>=
  # 7.0.0), webfakes (>= 1.4.0) and the fleet packages postdate the last
  # snapshot inside R 4.1's support window, and rurl must come from a commit
  # (x-floor below). So the floor leg is x-floor, on .t2-job, in its place.
  FLEET_FLOOR: "false"

# The deep-check leg at the declared R floor, `Depends: R (>= 4.1.0)`, in
# place of the template's t2-floor (FLEET_FLOOR above).
#
# 4.1 is the floor rurl (through pslr) and raddr need, and the oldest minor
# with an arm64 rocker/r-ver image (4.1.3).
#
# - Packages come from one dated Posit Package Manager snapshot,
#   FLOOR_SNAPSHOT. 2025-04-10 is the day before R 4.5.0, when R 4.1 was
#   still inside these dependencies' support window, and before bit64 4.8.0,
#   which gcc 9 cannot build (raddr's floor leg); nothing here installs bit64
#   anyway.
# - What postdates the snapshot comes from CRAN itself, without dependencies,
#   after its own dependencies came from the snapshot: the fleet packages
#   (raddr, pslr, punycoder), curl (ssrfr needs >= 7.0.0; the snapshot has
#   6.2.2), rlang and vctrs (raddr needs rlang >= 1.1.7 and vctrs >= 0.7.0)
#   and webfakes (the TLS fixtures need >= 1.4.0; the snapshot has 1.3.2).
#   Measured 2026-10-03 against both repositories, and installed cold again
#   on 2026-10-04: that closure has no version conflict, and no package in it
#   declares an R floor above 4.1.3.
# - curl, the binary, is in the apt line because every R curl since 7.0.0
#   wants libcurl >= 7.73, and focal has 7.68.0: its configure then fetches
#   a static libcurl (8.14.1) with that binary, and without it the build
#   falls through to `CURLINFO_EFFECTIVE_METHOD undeclared` (pipeline
#   2909642350). The static libcurl meets `SystemRequirements: libcurl (>=
#   7.73.0)`, so the transport tests run against it, not focal's.
# - TEMPORARY rurl pin. rurl 3.1.0, the CRAN release, zero-pads IPv6 pieces
#   under R < 4.2 ([64:ff9b::5db8:d822] serializes as [0064:ff9b::...]), and
#   test-dependencies.R fails here on it. rurl's main has the fix (c659973,
#   SEOR-nxycpzlk), so this job installs rurl from RURL_SHA, a commit on that
#   main, in place of the CRAN release. Once CRAN serves the fixed rurl, put
#   rurl back in the CRAN list, drop RURL_SHA and this item, and consider the
#   template's t2-floor again.
# - Only what the check needs is installed: the hard dependencies, the test
#   and vignette Suggests, and rcmdcheck. oysteR and rosv serve the audits,
#   whose tests skip without them, so _R_CHECK_FORCE_SUGGESTS_=false lets
#   --as-cran report them as a NOTE instead of stopping.
# - Vignettes are neither built nor checked, as in pagerankr and punycoder.
# - No hostile locales are built, so test-locale.R skips its legs here;
#   t2-locale and the local gate run them.
#
# The image tag is a variable so Renovate's gitlabci manager cannot bump the
# floor to a current R. BLOCKING, like every T2 leg: a scheduled detector
# that cannot go red is worthless. A cold docker run of this job's script in
# rocker/r-ver:4.1.3 passed on 2026-10-04 (SEOR-rcpzfhgx, SSRF-ecrqkmcz):
# 5 NOTEs, no WARNING.
x-floor:
  extends: .t2-job
  image: rocker/r-ver:$R_FLOOR_VERSION
  variables:
    R_FLOOR_VERSION: "4.1.3"
    FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2025-04-10"
    # A commit on rurl's main carrying its R 4.1 IPv6 fix (comment above).
    RURL_SHA: "6c6a1d26f060506311cdfa205baa02235889be72"
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    _R_CHECK_FORCE_SUGGESTS_: "false"
    # Incoming off: on a release tag it warns "Insufficient package version"; t2-ascran covers incoming.
    _R_CHECK_CRAN_INCOMING_: "false"
    R_LIBS_USER: "$CI_PROJECT_DIR/.cache/R-floor"
    R_LIBS: "$CI_PROJECT_DIR/.cache/R-floor:/usr/local/lib/R/site-library:/usr/local/lib/R/library"
  cache:
    key: floor-r41-2025-04-10-v2
    paths:
      - .cache/R-floor
  before_script:
    - mkdir -p "$R_LIBS_USER"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends pkg-config libcurl4-openssl-dev libssl-dev zlib1g-dev curl
    - >
      Rscript -e 'snap <- c("cli", "glue", "lifecycle", "stringi", "digest", "Rcpp", "cpp11",
      "callr", "httpuv", "knitr", "pkgload", "processx", "rmarkdown",
      "testthat", "webfakes", "withr", "rcmdcheck");
      need <- setdiff(snap, rownames(installed.packages()));
      if (length(need)) install.packages(need, repos = Sys.getenv("FLOOR_SNAPSHOT"), Ncpus = 4L);
      install.packages(c("rlang", "vctrs", "curl", "punycoder", "pslr", "raddr",
      "webfakes"),
      repos = "https://cloud.r-project.org", dependencies = FALSE, Ncpus = 4L);
      sha <- Sys.getenv("RURL_SHA"); tgz <- file.path(tempdir(), "rurl.tar.gz");
      download.file(paste0("https://gitlab.com/bart-turczynski/rurl/-/archive/", sha, "/rurl-", sha, ".tar.gz"), tgz, mode = "wb");
      install.packages(tgz, repos = NULL, type = "source");
      stopifnot(all(vapply(c("curl", "raddr", "rurl", "testthat", "rcmdcheck", "webfakes"),
      requireNamespace, NA, quietly = TRUE)));
      stopifnot(packageVersion("curl") >= "7.0.0", packageVersion("webfakes") >= "1.4.0",
      packageVersion("rurl") > "3.1.0");
      print(R.version.string); print(curl::curl_version()$version); print(packageVersion("rurl"))'
    # rcmdcheck reads a check that halted partway as 0/0/0 and returns
    # normally, so error_on never fires; the guard also fails on R CMD check's
    # own exit status (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
      build_args = c("--no-manual", "--no-build-vignettes"),
      error_on = "warning", check_dir = "check");
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    paths:
      - check/
    expire_in: 1 week

# FOSSA license and security scan (seor design/fleet-standard.md, "FOSSA":
# ssrfr is one of the three FOSSA packages), on .t2-job as ADR 0012 says:
# `fossa analyze` runs on the weekly deep-check and in every release
# pipeline, not on every merge, so the FOSSA project and the README's
# badges are refreshed at most weekly and at each release. FOSSA_API_KEY is
# a masked CI/CD variable only the owner holds, so the job fails, rather
# than skipping green, when it is missing. The CLI comes from FOSSA's
# official install script, which ships linux/arm64 builds for this runner.
# The pipeline is a detached checkout, so the branch and revision are passed
# rather than inferred; a tag pipeline has no branch and reports main, the
# branch the released commit is on. Copied from seor's `fossa` job.
x-fossa:
  extends: .t2-job
  image: debian:trixie-slim
  script:
    - test -n "${FOSSA_API_KEY:-}" || { echo "FOSSA_API_KEY is not set on this project; fossa analyze cannot upload."; exit 1; }
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl ca-certificates git
    - >
      curl -fsSL -H 'Cache-Control: no-cache'
      https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | sh
    - fossa analyze --branch "${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}" --revision "$CI_COMMIT_SHA"

# Renovate bumps the CI images (renovate.json), on the deep-check schedule
# only (ADR 0012): never in a tag or release pipeline. Needs a RENOVATE_TOKEN
# CI/CD variable: a personal access token with `api` and `write_repository`
# scope. Project access tokens need GitLab Premium, and this namespace is
# Free (SEOR-tzxuisnf).
x-renovate:
  extends: .schedule-job
  image: renovate/renovate:44
  variables:
    FLEET_JOB_SCHEDULE: deep-check
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    # Skip loudly rather than fail when the token is missing: a red scheduled
    # pipeline for a setup step nobody has done yet is noise. Every other
    # renovate failure fails the job.
    - |
      if [ -z "${RENOVATE_TOKEN:-}" ]; then
        echo "RENOVATE_TOKEN is not set - skipping renovate."
        echo "Add it under Settings > CI/CD > Variables: a personal access token"
        echo "with 'api' and 'write_repository' scope."
        exit 0
      fi
    - renovate
